name: Android CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    name: Build, test and package
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SLOVIGO_STORE_PASSWORD: ${{ secrets.SLOVIGO_STORE_PASSWORD }}
      SLOVIGO_KEY_ALIAS: ${{ secrets.SLOVIGO_KEY_ALIAS }}
      SLOVIGO_KEY_PASSWORD: ${{ secrets.SLOVIGO_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Install Android SDK
        run: |
          echo "Android SDK: $ANDROID_HOME"
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - name: Configure signing
        id: signing
        env:
          KEY_BASE64: ${{ secrets.SLOVIGO_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEY_BASE64" ] && [ -n "$SLOVIGO_STORE_PASSWORD" ] &&
             [ -n "$SLOVIGO_KEY_ALIAS" ] && [ -n "$SLOVIGO_KEY_PASSWORD" ]; then
            echo "$KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/slovigo-release.jks"
            echo "SLOVIGO_KEYSTORE_FILE=$RUNNER_TEMP/slovigo-release.jks" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Build and unit tests
        run: gradle --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleRelease :app:bundleRelease
      - name: Verify signing when provided
        if: steps.signing.outputs.signed == 'true'
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$APKSIGNER" verify app/build/outputs/apk/release/app-release.apk
      - name: Collect packages
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/Slovigo-debug.apk
          if [ "${{ steps.signing.outputs.signed }}" = "true" ]; then
            cp app/build/outputs/apk/release/app-release.apk dist/Slovigo-release-signed.apk
            cp app/build/outputs/bundle/release/app-release.aab dist/Slovigo-release-signed.aab
          else
            cp app/build/outputs/bundle/release/app-release.aab dist/Slovigo-release-UNSIGNED.aab
          fi
          (cd dist && sha256sum * > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: slovigo-build-${{ github.run_number }}
          path: dist/
          if-no-files-found: error
          retention-days: 30
      - name: Publish a GitHub release on each main push
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNED: ${{ steps.signing.outputs.signed }}
        run: |
          tag="v0.1.${GITHUB_RUN_NUMBER}"
          git tag "$tag"
          git push origin "$tag"
          if [ "$SIGNED" = "true" ]; then
            gh release create "$tag" dist/* --title "Slovigo $tag" --notes "Android API 24–36; potpisani APK/AAB. CI testovi i SHA-256 priloženi."
          else
            gh release create "$tag" dist/* --prerelease --title "Slovigo $tag (testno izdanje)" --notes "Testni APK se može instalirati. AAB je NEPOTPISAN i NIJE spreman za Google Play. Za produkcijske pakete postavite repozitorijske signing secrets."
          fi
