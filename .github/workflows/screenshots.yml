name: Capture actual Android screenshots

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  splash-screenshot:
    name: Capture splash in Pixel emulator
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Prepare Android 17 for compilation
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" "platforms;android-37.0" "platform-tools" "build-tools;36.0.0"
      - name: Build Android debug
        run: gradle --no-daemon :app:assembleDebug
      - name: Capture screenshot from a real Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            set -e
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell settings put system font_scale 1.0
            adb shell am start -n hr.brendigo.slovigo.debug/hr.brendigo.slovigo.MainActivity
            sleep 8
            mkdir -p docs/screenshots
            adb exec-out screencap -p > docs/screenshots/splash-phone.png
            file docs/screenshots/splash-phone.png
            test -s docs/screenshots/splash-phone.png
      - name: Publish screenshot as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: real-android-splash-screenshot
          path: docs/screenshots/splash-phone.png
          if-no-files-found: error
      - name: Update README screenshot in repository
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots/splash-phone.png
          if ! git diff --cached --quiet; then
            git commit -m "docs: update actual splash screenshot [skip ci]"
            git push origin HEAD:main
          fi
